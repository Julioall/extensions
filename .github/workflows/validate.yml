name: Validate Modules
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
jobs:
  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check apps/modules/content-v3.js
          node --check apps/modules/background-v3.js
          node --check apps/modules/catalog-v3-lib.js
          node --check registry/packages/corrections-0.3.0.js
          node --check registry/packages/dates-0.3.0.js
      - name: Tests
        working-directory: apps/modules
        run: npm test
      - name: Build minimal extension ZIP
        run: |
          cd apps/modules
          zip -q -r ../../Modules-0.3.0.zip manifest.json background-v3.js content-v3.js modal-v3.css catalog-v3-lib.js catalog-v3.json icons README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Modules-0.3.0
          path: Modules-0.3.0.zip
          if-no-files-found: error
