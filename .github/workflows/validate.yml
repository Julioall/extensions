name: Validate original Moodle modules
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check master scripts
        run: |
          node --check apps/modules/modules-background.js
          node --check apps/modules/popup.js
          node --check apps/modules/radial.js
      - name: Verify original source integrity, routes and catalog
        run: node --test apps/modules/tests/*.test.mjs
      - name: Build installable extension
        run: |
          cd apps/modules
          zip -q -r ../../Modules-v0.5.2.zip . -x 'tests/*' 'compat-integrity.json'
      - uses: actions/upload-artifact@v4
        with:
          name: Modules-v0.5.2
          path: Modules-v0.5.2.zip
          if-no-files-found: error
